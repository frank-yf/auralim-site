name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - VALIDATION.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build for the GitHub project path
        run: npm run build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Verify bilingual routes and resource paths
        run: node scripts/check-built-site.mjs "$SITE_BASE"
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
